[package]
name = "rgx-adapters-docs"
version = "0.1.1"
edition = "2021"
authors = ["Dan Alec Yamaguchi <danalec@gmail.com>"]
description = "rgx adapters that shell out to external tools (soffice, tesseract) when present on PATH"
license = "Apache-2.0"
readme = "README.md"
keywords = ["markdown", "latex", "docbook", "markup"]
categories = ["parser-implementations", "text-processing"]
repository = "https://github.com/danalec/rgx"
# What the published crate carries. The test corpus is the repository's:
# the fixtures under `testdata/` are what this crate's own tests read, and
# a user of the crate has no use for them. The examples are one-off
# diagnostics, not API demos. The licence and the notice are here because
# they are the law on the code.
include = [
    "/src/**",
    # The EGM contracts are the working documents of the review loop: they
    # are gitignored, they are not source, and `/src/**` would have carried
    # every one of them into the published crate. `exclude` cannot say it --
    # cargo ignores the exclude list when an include list is there -- so the
    # exclusion is a negation of the include.
    "!/src/**/EGM.md",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-APACHE",
    "/NOTICE",
]

[features]
# One feature per adapter, in the order `adapters()` returns them: the
# default build carries every format, so the default binary is unchanged,
# and a user who names the formats they need gets a binary that carries
# only those. The crate spawns processes, so it is std-only: there is no
# `std` feature to declare.
default = ["soffice", "ocr"]
# `soffice` shells out to LibreOffice and borrows the office crate's XML →
# text pass (`xml_to_text`) to read the flat ODF that soffice writes.
soffice = ["dep:rgx-adapters-office", "rgx-adapters-office/office"]
# `ocr` shells out to tesseract and borrows the pdf crate's page-image
# reader (`all_page_images`): tesseract refuses a PDF unless its build
# supports PDF input, so a scanned PDF is opened here and its page images
# are handed over instead. A page that carries no image of its own is
# rasterised by poppler's `pdftoppm` when the machine has that tool, and
# only then: it is an external binary like the others, not a dependency.
ocr = ["dep:rgx-adapters-pdf", "rgx-adapters-pdf/pdf"]

[dependencies]
rgx-core = { path = "../rgx-core", version = "0.1.1", default-features = false, features = ["std", "sha256-hw"] }
# for `xml_to_text` only: the soffice adapter converts to flat ODF (see
# Soffice::extract) and this is the tree's one XML → text pass. Compile-time
# only -- `rgx-adapters-office` reaches the registry through the root's own
# `adapters-office` feature, which this dependency does not imply.
# Optional: only the `soffice` family needs it, and it switches off
# with it.
rgx-adapters-office = { path = "../rgx-adapters-office", version = "0.1.1", default-features = false, optional = true }
# for `pages_of_a_pdf` only: the ocr adapter claims `ocr.pdf`, and tesseract
# refuses a PDF unless its build supports PDF input, so a scanned PDF is
# opened here and its page images handed over instead (see the fn).
# Optional: only the `ocr` family needs it, and it switches off with
# it.
rgx-adapters-pdf = { path = "../rgx-adapters-pdf", version = "0.1.1", default-features = false, optional = true }
