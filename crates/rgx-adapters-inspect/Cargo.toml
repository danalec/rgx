[package]
name = "rgx-adapters-inspect"
version = "0.1.1"
edition = "2021"
authors = ["Dan Alec Yamaguchi <danalec@gmail.com>"]
description = "rgx adapter: forensic binary inspection — magic identification, embedded-structure carving, strings, entropy"
license = "Apache-2.0"
readme = "README.md"
keywords = ["forensics", "carving", "strings", "metadata"]
categories = ["parser-implementations", "filesystem"]
repository = "https://github.com/danalec/rgx"
# What the published crate carries. The test corpus is the repository's:
# the fixtures under `testdata/` are what this crate's own tests read, and
# a user of the crate has no use for them. The examples are one-off
# diagnostics, not API demos. The licence and the notice are here because
# they are the law on the code.
include = [
    "/src/**",
    # The EGM contracts are the working documents of the review loop: they
    # are gitignored, they are not source, and `/src/**` would have carried
    # every one of them into the published crate. `exclude` cannot say it --
    # cargo ignores the exclude list when an include list is there -- so the
    # exclusion is a negation of the include.
    "!/src/**/EGM.md",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-APACHE",
    "/NOTICE",
]

[dependencies]
rgx-core = { path = "../rgx-core", version = "0.1.1", default-features = false, features = ["std", "sha256-hw"] }

[features]
# One feature per adapter, in the order `adapters()` returns them. The default
# is the whole crate, so the default binary is unchanged; a user who names the
# formats they need builds with `--no-default-features --features <name>` and
# gets a binary that carries only those.
#
# The crate is `#![no_std]` + `alloc`: no adapter touches the filesystem, the
# clock, threads or `std::env`, so there is no `std` feature to declare.
default = [
    "pe",
    "inspect",
    "macho",
    "elf",
    "dex",
    "wasm",
    "wasm-meta",
    "lnk",
    "x509",
    "compound",
    "bplist",
    "tiff",
    "djvu",
    "isobmff",
    "dwg",
    "parasolid",
    "acis-sab",
    "rvt",
    "dgn",
    "dxf",
    "step",
    "iges",
    "acis-sat",
    "stl",
    "cgm",
    "cals",
    "c4",
    "plt",
    "grib",
    "bufr",
    "segy",
    "root",
    "n5",
    "firebird",
    "bam",
    "bcf",
    "cram",
    "sam",
    "fasta",
    "fastq",
    "vcf",
    "gff",
    "pdb",
    "mmcif",
]
pe = []
inspect = ["rgx-core/deflate", "rgx-core/gzip"]
macho = []
elf = []
dex = []
wasm = []
wasm-meta = []
lnk = []
x509 = []
compound = []
bplist = []
tiff = []
djvu = ["rgx-core/zlib"]
isobmff = []
dwg = []
parasolid = []
acis-sab = []
rvt = []
dgn = []
dxf = []
step = []
iges = []
acis-sat = []
stl = []
cgm = []
cals = []
c4 = []
plt = []
grib = []
bufr = []
segy = []
root = []
n5 = []
firebird = []
bam = ["rgx-core/gzip"]
bcf = ["rgx-core/gzip"]
cram = ["rgx-core/gzip", "rgx-core/bzip2", "rgx-core/xz"]
sam = ["rgx-core/gzip"]
fasta = ["rgx-core/gzip"]
fastq = ["rgx-core/gzip"]
vcf = []
gff = []
pdb = []
mmcif = []
