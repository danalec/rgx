[package]
name = "rgx-adapters-media"
version = "0.1.1"
edition = "2021"
authors = ["Dan Alec Yamaguchi <danalec@gmail.com>"]
description = "rgx adapters for media metadata (EXIF/TIFF, audio tags, FITS, DICOM)"
# Every file in this crate is Apache-2.0 and carries the SPDX header saying
# so — the EXIF/TIFF parser included. See the repository's COPYING.
license = "Apache-2.0"
readme = "README.md"
keywords = ["exif", "jpeg", "png", "tiff", "font"]
categories = ["parser-implementations", "multimedia"]
repository = "https://github.com/danalec/rgx"
# What the published crate carries. The test corpus is the repository's:
# the fixtures under `testdata/` are what this crate's own tests read, and
# a user of the crate has no use for them. The examples are one-off
# diagnostics, not API demos. The licence and the notice are here because
# they are the law on the code.
include = [
    "/src/**",
    # The EGM contracts are the working documents of the review loop: they
    # are gitignored, they are not source, and `/src/**` would have carried
    # every one of them into the published crate. `exclude` cannot say it --
    # cargo ignores the exclude list when an include list is there -- so the
    # exclusion is a negation of the include.
    "!/src/**/EGM.md",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-APACHE",
    "/NOTICE",
]

[features]
# One feature per adapter, in `adapters()` order. The default build keeps
# every format, so the default binary is unchanged; a user who names the
# formats they need gets a binary that carries only those.
default = [
    "exif",
    "tiff",
    "gif",
    "bmp",
    "psd",
    "jpeg2000",
    "jpegxl",
    "openexr",
    "avi",
    "asf",
    "flv",
    "mpeg",
    "audio-tags",
    "fits",
    "dicom",
    "font",
    "woff",
    "mobi",
    "video-tags",
]
exif = []
tiff = []
gif = []
bmp = []
psd = []
jpeg2000 = []
jpegxl = []
openexr = []
avi = []
asf = []
flv = []
mpeg = []
audio-tags = []
fits = []
dicom = []
font = []
woff = []
mobi = []
video-tags = []

[dependencies]
rgx-core = { path = "../rgx-core", version = "0.1.1", default-features = false, features = ["std", "sha256-hw"] }
