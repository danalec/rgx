[package]
name = "rgx-adapters-mail"
version = "0.1.1"
edition = "2021"
authors = ["Dan Alec Yamaguchi <danalec@gmail.com>"]
description = "rgx adapters for e-mail archives (mbox, eml) with MIME attachment recursion"
license = "Apache-2.0"
readme = "README.md"
keywords = ["email", "mbox", "eml", "pst"]
categories = ["parser-implementations", "encoding"]
repository = "https://github.com/danalec/rgx"
# What the published crate carries. The test corpus is the repository's:
# the fixtures under `testdata/` are what this crate's own tests read, and
# a user of the crate has no use for them. The examples are one-off
# diagnostics, not API demos. The licence and the notice are here because
# they are the law on the code.
include = [
    "/src/**",
    # The EGM contracts are the working documents of the review loop: they
    # are gitignored, they are not source, and `/src/**` would have carried
    # every one of them into the published crate. `exclude` cannot say it --
    # cargo ignores the exclude list when an include list is there -- so the
    # exclusion is a negation of the include.
    "!/src/**/EGM.md",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-APACHE",
    "/NOTICE",
]

[features]
# One feature per adapter, in the order `adapters()` returns them. The
# default is the whole crate, so the default build keeps every format; a
# binary that names only the formats it wants builds with
# `--no-default-features --features <name>`.
#
# `std` is the crate's own feature: the crate is `#![no_std]` + `alloc`, and
# the only thing `std` buys is the `std::error::Error` impl on `PstErr`.
# Every family but `pst` is pure byte slicing and needs no `std` at all.
default = ["std", "mbox", "eml", "msg", "emlx", "pst", "wab", "mmdf", "thunderbird", "apple-mailbox"]
std = []
mbox = []
eml = []
msg = []
# An `.emlx` is an RFC-822 message plus a binary-plist trailer: the adapter
# strips the trailer and hands the message to the `eml` adapter, so the
# family cannot exist without it.
emlx = ["eml"]
pst = ["std"]
wab = []
mmdf = []
thunderbird = []
apple-mailbox = []

[dependencies]
rgx-core = { path = "../rgx-core", version = "0.1.1", default-features = false, features = ["std", "sha256-hw"] }
