format-vtk = ["dep:rgx-adapters-threed", "rgx-adapters-threed/vtk"]
format-blend = ["dep:rgx-adapters-threed", "rgx-adapters-threed/blend"]
format-3ds = ["dep:rgx-adapters-threed", "rgx-adapters-threed/threeds"]
format-nifti = ["dep:rgx-adapters-threed", "rgx-adapters-threed/nifti"]
format-mrc = ["dep:rgx-adapters-threed", "rgx-adapters-threed/mrc"]

# Optional Windows scaling: see `mimalloc` dep above. Off by default
# because the variance it adds on this machine outweighs the median
# gain the user's claim cites: the same seven-round bench that prints
# rgx at 0.93x of rg with mimalloc also prints rgx at 0.93x without
# it, and without mimalloc the slowest round is 43 ms instead of 98.
# Opt in explicitly: `cargo build --features mimalloc`.
mimalloc = ["dep:mimalloc"]
[dev-dependencies]
flate2 = "1"
zip = { version = "9", default-features = false }
# the oracle: tests/walk_diff.rs walks the same tree with the `ignore` crate
# and requires the in-house walker to agree file for file
ignore = "0.4"

# cross-crate inlining of the hot paths (search loop, memmem scanners) —
# thin LTO + single codegen unit; measured single-digit % on the corpus
# walks, free at run time
[profile.release]
lto = "thin"
codegen-units = 1
